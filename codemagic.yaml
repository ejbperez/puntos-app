workflows:
  ios-release:
    name: Puntos App iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ejbperez.puntosapp
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Apply Codemagic signing profiles
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
