workflows:
  android-release:
    name: Puntos App Android Release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - puntos-app-release
      vars:
        PACKAGE_NAME: com.ejbperez.puntos_app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

  ios-release:
    name: Puntos App iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ejbperez.puntosapp
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Apply Codemagic signing profiles
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
