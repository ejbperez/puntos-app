<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A cross-platform, offline-first sports scoring app.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Puntos App">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Puntos App</title>
  <style>
    #puntos-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #f8f8f5;
      z-index: 9999;
      transition: opacity 180ms ease;
    }

    #puntos-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #puntos-loader img {
      width: min(58vw, 220px);
      height: auto;
      border-radius: 24%;
      box-shadow: 0 12px 32px rgba(7, 42, 63, 0.14);
    }
  </style>
</head>
<body>
  <div id="puntos-loader" role="status" aria-label="Loading Puntos App">
    <img src="icons/Icon-512.png" alt="Puntos App">
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('puntos-loader');
      if (!loader) return;
      loader.classList.add('is-hidden');
      window.setTimeout(function () { loader.remove(); }, 220);
    });
  </script>
</body>
</html>
